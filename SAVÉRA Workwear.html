function load<T>(key: string, fallback: T): T {
  try {
    const v = localStorage.getItem(key);
    return v ? (JSON.parse(v) as T) : fallback;
  } catch (e) { return fallback; }
}
function save(key: string, value: any) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
}

function hexToRgb(h: string) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a: string, b: string, t: number) {
  const A = hexToRgb(a), B = hexToRgb(b);
  const c = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
}
function isDark(hex: string) {
  const [r, g, b] = hexToRgb(hex);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b < 110;
}

    const hay = (p.name + " " + p.category + " " + p.colors.join(" ") + " " + p.kind + " " + p.description).toLowerCase();
    return words.every((w) => hay.includes(w));
  });
}

function buildWhatsAppMessage(lines: CartLine[], c: Partial<Customer>, subtotal: number, delivery: number) {
  const out: string[] = [];
  out.push("Hello " + CONFIG.brand.short + "! I would like to place an order.");
  out.push("");
  out.push("*Customer*");
  out.push("Name: " + (c.name || "(please add your name)"));
  if (c.phone) out.push("Phone: " + c.phone);
  out.push("");
  out.push("*Order*");
  lines.forEach((l, i) => {
    const p = byId(l.id);
    if (!p) return;
    out.push((i + 1) + ". " + p.name + " | Size " + l.size + " | " + l.color + " | Qty " + l.qty + " | " + fmt(p.price * l.qty));
  });
  out.push("");
  out.push("Subtotal: " + fmt(subtotal));
  out.push("Delivery: " + (delivery === 0 ? "Free" : fmt(delivery)));
  out.push("*Total: " + fmt(subtotal + delivery) + "*");
  out.push("");
  out.push("*Delivery details*");
  const addr = [c.address, c.city, c.district, c.postal].filter(Boolean).join(", ");
  out.push(addr || "(address to be confirmed)");
  if (c.payment) out.push("Payment: " + (c.payment === "bank" ? "Bank transfer" : "Cash on delivery"));
  if (c.notes) out.push("Notes: " + c.notes);
  return out.join("\n");
}

//  8. STORE (cart, wishlist, routing, UI state)

const Store = createContext<any>(null);
const useStore = () => useContext(Store);

const emptyCustomer: Customer = { name: "", phone: "", email: "", address: "", city: "", district: "", postal: "", notes: "", payment: "cod" };

function useHashRoute() {
  const read = () => (location.hash || "").replace(/^#/, "") || "home";
  const [route, setRoute] = useState<string>(read());
  useEffect(() => {
    const on = () => { setRoute(read()); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return route;
}

function StoreProvider({ children }: { children: any }) {
  const route = useHashRoute();
  const [cart, setCart] = useState<CartLine[]>(() => load<CartLine[]>("elan_cart_v1", []).filter((l) => !!byId(l.id)));
  const [wishlist, setWishlist] = useState<string[]>(() => load<string[]>("elan_wish_v1", []));
  const [customer, setCustomer] = useState<Customer>(() => ({ ...emptyCustomer, ...load<Partial<Customer>>("elan_customer_v1", {}) }));
  const [lastOrder, setLastOrder] = useState<any>(() => load<any>("elan_last_order_v1", null));
  const [query, setQuery] = useState("");
  const [ui, setUi] = useState({ cart: false, menu: false, search: false, account: false, sizeGuide: false, filters: false, quick: null as string | null });
  const [toast, setToast] = useState<string | null>(null);
  const toastTimer = useRef<any>(null);

  useEffect(() => save("elan_cart_v1", cart), [cart]);
  useEffect(() => save("elan_wish_v1", wishlist), [wishlist]);
  useEffect(() => save("elan_customer_v1", customer), [customer]);

  useEffect(() => {
    setUi((u) => ({ ...u, menu: false, search: false, account: false, quick: null, filters: false, cart: false }));
  }, [route]);

  useEffect(() => {
    const open = ui.cart || ui.menu || ui.search || ui.account || ui.sizeGuide || ui.filters || ui.quick;
    document.body.style.overflow = open ? "hidden" : "";
  }, [ui]);

  const flash = useCallback((msg: string) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  }, []);

  const addToCart = useCallback((id: string, color: string, size: Size, qty = 1, openCart = true) => {
    setCart((prev) => {
      const key = lineKey({ id, color, size });
      const i = prev.findIndex((l) => lineKey(l) === key);
      if (i >= 0) return prev.map((l, j) => (j === i ? { ...l, qty: Math.min(10, l.qty + qty) } : l));
      return [...prev, { id, color, size, qty: Math.min(10, qty) }];
    });
    if (openCart) setUi((u) => ({ ...u, cart: true, quick: null }));
  }, []);

  const removeLine = useCallback((key: string) => setCart((prev) => prev.filter((l) => lineKey(l) !== key)), []);
  const setQty = useCallback((key: string, qty: number) => {
    setCart((prev) => prev.map((l) => (lineKey(l) === key ? { ...l, qty: Math.max(1, Math.min(10, qty)) } : l)));
  }, []);
  const changeVariant = useCallback((key: string, patch: { color?: string; size?: Size }) => {
    setCart((prev) => {
      const cur = prev.find((l) => lineKey(l) === key);
      if (!cur) return prev;
      const next = { ...cur, ...patch };
      const nk = lineKey(next);
      if (nk === key) return prev;
      const dupe = prev.find((l) => lineKey(l) === nk);
      if (dupe) return prev.filter((l) => lineKey(l) !== key).map((l) => (lineKey(l) === nk ? { ...l, qty: Math.min(10, l.qty + cur.qty) } : l));
      return prev.map((l) => (lineKey(l) === key ? next : l));
    });
  }, []);
  const clearCart = useCallback(() => setCart([]), []);

  const toggleWish = useCallback((id: string) => {
    setWishlist((prev) => {
      const has = prev.includes(id);
      flash(has ? "Removed from wishlist" : "Saved to wishlist");
      return has ? prev.filter((x) => x !== id) : [...prev, id];
    });
  }, [flash]);

  const totals = useMemo(() => {
    const subtotal = cart.reduce((s, l) => s + (byId(l.id)?.price || 0) * l.qty, 0);
    const delivery = deliveryFor(subtotal);
    const count = cart.reduce((s, l) => s + l.qty, 0);
    return { subtotal, delivery, total: subtotal + delivery, count };
  }, [cart]);

  const set = (patch: any) => setUi((u) => ({ ...u, ...patch }));
  const closeAll = () => setUi({ cart: false, menu: false, search: false, account: false, sizeGuide: false, filters: false, quick: null });

  const value = {
    route, cart, wishlist, customer, setCustomer, lastOrder, setLastOrder, query, setQuery, ui, set, closeAll, toast, flash,
    addToCart, removeLine, setQty, changeVariant, clearCart, toggleWish, totals,
  };
  return <Store.Provider value={value}>{children}</Store.Provider>;
}

function Reveal({ children, className = "", delay = 0 }: { children: any; className?: string; delay?: number }) {
  const ref = useRef<HTMLDivElement>(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { setOn(true); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, { threshold: 0.1, rootMargin: "0px 0px -4% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} style={{ transitionDelay: delay + "ms" }} className={"reveal " + (on ? "in " : "") + className}>{children}</div>;
}

}

function Swatch({ color, on, onClick, size = 22 }: { color: string; on?: boolean; onClick?: () => void; size?: number }) {
  const inner = (
    <span className={"sw " + (on ? "on" : "")} style={{ background: SWATCH[color], width: size, height: size }} />
  );
  if (!onClick) return <span className="p-[3px]" title={color}>{inner}</span>;
  return (
    <button type="button" onClick={onClick} aria-label={color} aria-pressed={!!on} title={color} className="swb">
      {inner}
    </button>
  );
}

function Panel({ open, onClose, side = "right", label, children }: { open: boolean; onClose: () => void; side?: "left" | "right"; label: string; children: any }) {
  useEffect(() => {
    if (!open) return;
    const h = (e: KeyboardEvent) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);
  const closed = side === "right" ? "translate-x-full" : "-translate-x-full";
  return (
    <div className={"fixed inset-0 z-[100] " + (open ? "" : "pointer-events-none")} aria-hidden={!open}>
      <div onClick={onClose} className={"absolute inset-0 bg-charcoal/40 transition-opacity duration-500 " + (open ? "opacity-100" : "opacity-0")} />
      <aside
        role="dialog" aria-modal="true" aria-label={label}
        className={"absolute top-0 bottom-0 flex flex-col w-[min(440px,92vw)] bg-cream shadow-2xl transition-transform duration-500 ease-[cubic-bezier(.2,.7,.2,1)] " + (side === "right" ? "right-0 " : "left-0 ") + (open ? "translate-x-0" : closed)}
        style={{ paddingTop: "env(safe-area-inset-top,0px)", paddingBottom: "env(safe-area-inset-bottom,0px)", [side === "right" ? "paddingRight" : "paddingLeft"]: "env(safe-area-inset-" + side + ",0px)" }}
      >
        {children}
      </aside>
    </div>
  );
}

function Modal({ open, onClose, label, wide = false, children }: { open: boolean; onClose: () => void; label: string; wide?: boolean; children: any }) {
  useEffect(() => {
    if (!open) return;
    const h = (e: KeyboardEvent) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center sm:p-6" style={{ paddingLeft: "max(0px,env(safe-area-inset-left,0px))", paddingRight: "max(0px,env(safe-area-inset-right,0px))" }}>
      <div onClick={onClose} className="absolute inset-0 bg-charcoal/45 fade" />
      <div role="dialog" aria-modal="true" aria-label={label}
        className={"pop relative bg-cream w-full max-h-[92vh] overflow-y-auto rounded-t-[18px] sm:rounded-[14px] shadow-2xl " + (wide ? "sm:max-w-[920px]" : "sm:max-w-[520px]")}
        style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
        <button onClick={onClose} aria-label="Close" className="absolute right-3 top-3 z-10 w-11 h-11 grid place-items-center rounded-full bg-white/90 hover:bg-white transition-colors">
          <Icon name="X" size={20} />
        </button>
        {children}
      </div>
    </div>
  );
}

            </div>
            <div className="flex flex-wrap gap-2">
              {ALL_SIZES.map((z) => <button key={z} type="button" disabled={!p.sizes.includes(z)} className={"chip " + (size === z ? "on" : "")} onClick={() => { setSize(z); setErr(false); }}>{z}</button>)}
            </div>
            {err && <p className="text-[13px] text-[#9E3B2F] mt-2" role="alert">Please choose a size.</p>}

function isActive(route: string, item: string) {
  if (item === "shop") return route === "shop" || route.startsWith("shop-") || route === "bestsellers";
  if (item === "collections") return route === "collections" || route.startsWith("look-");
  return route === item;
}

function SearchOverlay() {
  const s = useStore();
  const [q, setQ] = useState("");
  const ref = useRef<HTMLInputElement>(null);
  useEffect(() => { if (s.ui.search) setTimeout(() => ref.current && ref.current.focus(), 200); }, [s.ui.search]);
  useEffect(() => {
    if (!s.ui.search) return;
    const h = (e: KeyboardEvent) => { if (e.key === "Escape") s.set({ search: false }); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [s.ui.search]);
  const results = useMemo(() => (q.trim() ? searchProducts(q).slice(0, 5) : []), [q]);
  const submit = (e: any) => { e.preventDefault(); s.setQuery(q); s.closeAll(); location.hash = "shop"; };
  const open = s.ui.search;
  return (
    <div className={"fixed inset-0 z-[105] " + (open ? "" : "pointer-events-none")} aria-hidden={!open}>
      <div onClick={() => s.set({ search: false })} className={"absolute inset-0 bg-charcoal/40 transition-opacity duration-500 " + (open ? "opacity-100" : "opacity-0")} />
      <div role="dialog" aria-modal="true" aria-label="Search" className={"absolute inset-x-0 top-0 bg-cream shadow-xl transition-transform duration-500 ease-[cubic-bezier(.2,.7,.2,1)] " + (open ? "translate-y-0" : "-translate-y-full")} style={{ paddingTop: "env(safe-area-inset-top,0px)" }}>
        <div className="wrap py-5 md:py-8">
          <form onSubmit={submit} className="flex items-center gap-3 border-b border-charcoal pb-3">
            <Icon name="Search" size={22} />
            <input ref={ref} id="site-search" value={q} onChange={(e: any) => setQ(e.target.value)} placeholder="Search blouses, trousers, dresses…" className="flex-1 bg-transparent outline-none font-display text-[1.6rem] md:text-[2rem] placeholder:text-charcoal/35 min-w-0" aria-label="Search products" />
            <button type="button" onClick={() => s.set({ search: false })} className="w-11 h-11 grid place-items-center" aria-label="Close search"><Icon name="X" size={22} /></button>
          </form>
          {q.trim() === "" ? (
            <div className="pt-5 pb-3">
              <p className="eyebrow mb-3">Popular searches</p>
              <div className="flex flex-wrap gap-2">
                {["linen shirt", "trousers", "midi dress", "blazer", "sage"].map((t) => <button key={t} type="button" className="chip" onClick={() => setQ(t)}>{t}</button>)}
              </div>
            </div>
          ) : (
            <div className="pt-4 pb-2">
              {results.length === 0 ? <p className="text-muted py-4">No products match “{q}”.</p> : (
                <ul>
                  {results.map((p) => (
                    <li key={p.id}>
                      <a href={"#product-" + p.id} className="flex items-center gap-4 py-2.5 hover:bg-white/70 rounded-lg px-2 -mx-2">
                        <span className="w-14 aspect-[3/4] rounded-md overflow-hidden bg-softgray block"><ProductImage p={p} color={p.colors[0]} /></span>
                        <span className="flex-1 text-[15px]">{p.name}<span className="block text-[12.5px] text-muted">{p.category}</span></span>
                        <span className="text-[14px] tabular-nums">{fmt(p.price)}</span>
                      </a>
                    </li>
                  ))}
                </ul>
              )}
              <button type="button" onClick={submit} className="btn btn-dark mt-3">See all results</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ShopPage({ route }: { route: string }) {
  const s = useStore();
  const preset = route === "new-arrivals" ? "new" : route === "bestsellers" ? "best" : null;
  const cat = CATEGORIES.find((c) => c.route === route) || CATEGORIES[0];
  const [f, setF] = useState<any>({ price: [], sizes: [], colors: [], bestOnly: false });
  const [sort, setSort] = useState<string>(preset === "new" ? "newest" : preset === "best" ? "best" : "featured");
  useEffect(() => { setSort(preset === "new" ? "newest" : preset === "best" ? "best" : "featured"); }, [route]);

  const items = useMemo(() => {
    let list = searchProducts(s.query);
    if (cat.match) list = list.filter((p) => p.category === cat.match);
    if (preset === "new") list = list.filter((p) => p.isNew);
    if (preset === "best") list = list.filter((p) => p.best);
    if (f.price.length) list = list.filter((p) => PRICE_BUCKETS.some((b) => f.price.includes(b.id) && b.test(p.price)));
    if (f.sizes.length) list = list.filter((p) => f.sizes.some((z: Size) => p.sizes.includes(z)));
    if (f.colors.length) list = list.filter((p) => f.colors.some((c: string) => p.colors.includes(c)));
    if (f.bestOnly) list = list.filter((p) => p.best);
    const sorted = [...list];
    if (sort === "newest") sorted.sort((a, b) => b.added - a.added);
    else if (sort === "low") sorted.sort((a, b) => a.price - b.price);
    else if (sort === "high") sorted.sort((a, b) => b.price - a.price);
    else if (sort === "best") sorted.sort((a, b) => Number(b.best) - Number(a.best) || b.added - a.added);
    return sorted;
  }, [s.query, cat.id, preset, f, sort]);

  const activeCount = f.price.length + f.sizes.length + f.colors.length + (f.bestOnly ? 1 : 0);
  const clear = () => { setF({ price: [], sizes: [], colors: [], bestOnly: false }); s.setQuery(""); };
  const title = preset === "new" ? "New Arrivals" : preset === "best" ? "Bestsellers" : cat.label;

  return (
    <div className="wrap pt-10 lg:pt-16">
      <nav className="text-[12.5px] text-muted mb-6" aria-label="Breadcrumb"><a href="#home" className="link-u">Home</a> / <span className="text-charcoal">{title}</span></nav>
      <h1 className="font-display text-[clamp(2.6rem,6vw,4.6rem)] leading-none">{title}</h1>
      <p className="text-muted mt-3 max-w-[520px]">Minimal, comfortable workwear designed in Sri Lanka.</p>

      <div className="mt-8 flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">
        {CATEGORIES.map((c) => <a key={c.id} href={"#" + c.route} className={"chip whitespace-nowrap flex items-center " + (!preset && c.id === cat.id ? "on" : "")}>{c.label}</a>)}
      </div>

      <div className="mt-6 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div className="relative sm:w-[340px]">
          <label htmlFor="shop-search" className="sr-only">Search products</label>
          <Icon name="Search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-muted pointer-events-none" />
          <input id="shop-search" className="field !pl-11 !pr-11" placeholder="Search products" value={s.query} onChange={(e: any) => s.setQuery(e.target.value)} />
          {s.query && <button type="button" onClick={() => s.setQuery("")} aria-label="Clear search" className="absolute right-1 top-1/2 -translate-y-1/2 w-11 h-11 grid place-items-center"><Icon name="X" size={16} /></button>}
        </div>
        <div className="flex gap-3 items-center">
          <button type="button" className="btn btn-line lg:hidden flex-1 sm:flex-none" onClick={() => s.set({ filters: true })}><Icon name="SlidersHorizontal" size={16} /> Filters{activeCount ? " (" + activeCount + ")" : ""}</button>
          <div className="flex-1 sm:flex-none">
            <label htmlFor="sort" className="sr-only">Sort by</label>
            <select id="sort" className="field sm:w-[230px]" value={sort} onChange={(e: any) => setSort(e.target.value)}>
              <option value="featured">Sort: Featured</option>
              <option value="newest">Newest</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="best">Bestselling</option>
            </select>
          </div>
        </div>
      </div>

      <div className="mt-10 grid lg:grid-cols-[250px_1fr] gap-12">
        <aside className="hidden lg:block sticky self-start" style={{ top: "calc(env(safe-area-inset-top,0px) + 100px)" }} aria-label="Filters"><FilterPanel f={f} setF={setF} /></aside>
        <div>
          <div className="flex items-center justify-between mb-6 text-[13.5px] text-muted">
            <p aria-live="polite">{items.length} {items.length === 1 ? "piece" : "pieces"}</p>
            {(activeCount > 0 || s.query) && <button type="button" onClick={clear} className="underline underline-offset-4 text-charcoal">Clear all</button>}
          </div>
          {items.length === 0 ? (
            <div className="text-center py-20 bg-white/60 rounded-[14px]">
              <h2 className="font-display text-[2rem]">Nothing matches just yet</h2>
              <p className="text-muted mt-2">Try removing a filter or searching for something else.</p>
              <button type="button" className="btn btn-dark mt-6" onClick={clear}>Clear filters</button>
            </div>
          ) : <ProductGrid items={items} cols="grid-cols-2 md:grid-cols-3" />}
        </div>
      </div>

      <Panel open={s.ui.filters} onClose={() => s.set({ filters: false })} side="left" label="Filters">
        <div className="flex items-center justify-between px-5 h-[64px] border-b border-line shrink-0">
          <h2 className="font-display text-[1.7rem]">Filters</h2>
          <button type="button" className="w-11 h-11 -mr-2 grid place-items-center" onClick={() => s.set({ filters: false })} aria-label="Close filters"><Icon name="X" size={22} /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5"><FilterPanel f={f} setF={setF} close={() => s.set({ filters: false })} /></div>
      </Panel>
    </div>
  );
}

function ProductPage({ id }: { id: string }) {

  const [size, setSize] = useState<Size | "">("");
  const [qty, setQty] = useState(1);
  const [view, setView] = useState("front");
  const [err, setErr] = useState(false);

  if (!p) return <NotFound />;
  const wished = s.wishlist.includes(p.id);

        <div className="grid lg:grid-cols-12 gap-8 lg:gap-14">

              {views.map(([v, label]) => (
                <button key={v} type="button" onClick={() => setView(v)} aria-label={"Show " + label + " view"} aria-pressed={view === v}
                  className={"w-[22%] lg:w-full aspect-[3/4] rounded-lg overflow-hidden border-2 transition-colors " + (view === v ? "border-charcoal" : "border-transparent")}>
                  <ProductImage p={p} color={color} view={v} />

            </div>
            <div className="order-1 lg:order-2 aspect-[3/4] rounded-[14px] overflow-hidden bg-softgray zoom">
              <div key={view + color} className="w-full h-full zt fade"><ProductImage p={p} color={color} view={view} /></div>

          </div>

            <div className="flex items-center gap-3">
              <p className="eyebrow">{p.category}</p>
              {p.isNew && <span className="bg-sage/40 text-[10.5px] tracking-[.16em] uppercase font-semibold px-2.5 py-1 rounded-full">New Arrival</span>}
            </div>
            <div className="flex items-start justify-between gap-4 mt-3">
              <h1 className="font-display text-[clamp(2.2rem,4vw,3.2rem)] leading-[1.04] text-balance">{p.name}</h1>
              <button type="button" onClick={() => s.toggleWish(p.id)} aria-pressed={wished} aria-label={wished ? "Remove from wishlist" : "Add to wishlist"} className="w-12 h-12 shrink-0 rounded-full border border-line grid place-items-center hover:bg-white"><Icon name="Heart" size={20} className={wished ? "fill-charcoal" : ""} /></button>
            </div>
            <p className="text-[22px] mt-3 tabular-nums">{fmt(p.price)}</p>
            <p className="text-[15.5px] text-charcoal/75 leading-relaxed mt-5">{p.description}</p>

              <Accordion title="Delivery information"><p>Colombo and suburbs: 1–2 working days. Other districts: 2–4 working days. Delivery is {fmt(CONFIG.deliveryFee)}, and free on orders over {fmt(CONFIG.freeDeliveryOver)}. Cash on delivery is available islandwide.</p></Accordion>
              <Accordion title="Return information"><p>Exchange or return unworn items with tags attached within 7 days of delivery. Contact us on WhatsApp or by email and we will arrange a pickup.</p></Accordion>
            </div>
          </div>
        </div>
      </div>

      <section className="wrap pt-24">
        <SectionHead eyebrow="Pairs well with" title="You may also like" />
        <ProductGrid items={related} />
      </section>

      <div className="lg:hidden fixed inset-x-0 bottom-0 z-40 bg-white border-t border-line flex items-center gap-4 pt-3" style={{ paddingBottom: "calc(env(safe-area-inset-bottom,0px) + 12px)", paddingLeft: "max(16px,env(safe-area-inset-left,0px))", paddingRight: "max(16px,env(safe-area-inset-right,0px))" }}>
        <div className="min-w-0">
          <p className="text-[13px] truncate">{p.name}</p>
          <p className="text-[15px] font-semibold tabular-nums">{fmt(p.price * qty)}</p>
        </div>
        <button type="button" className="btn btn-dark flex-1" onClick={add}>{size ? "Add to Cart" : "Select Size"}</button>
      </div>
    </div>
  );

function CheckoutPage() {
  const s = useStore();
  const c: Customer = s.customer;
  const [errors, setErrors] = useState<Record<string, string>>({});
  const [busy, setBusy] = useState(false);
  const up = (k: keyof Customer, v: string) => { s.setCustomer({ ...c, [k]: v }); if (errors[k]) setErrors({ ...errors, [k]: "" }); };

  if (s.cart.length === 0) {
    return (
      <div className="wrap py-24 text-center">
        <h1 className="font-display text-[3rem]">Your bag is empty</h1>
        <p className="text-muted mt-3">Add a few pieces before checking out.</p>
        <a href="#shop" className="btn btn-dark mt-8">Continue shopping</a>
      </div>
    );
  }

  const validate = () => {
    const e: Record<string, string> = {};
    if (c.name.trim().length < 2) e.name = "Please enter your full name.";
    if (!/^(?:\+94|0)?7\d{8}$/.test(c.phone.replace(/[\s-]/g, ""))) e.phone = "Enter a valid Sri Lankan mobile number, e.g. 077 123 4567.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) e.email = "Please enter a valid email address.";
    if (c.address.trim().length < 5) e.address = "Please enter your delivery address.";
    if (!c.city.trim()) e.city = "Please enter your city.";
    if (!c.district) e.district = "Please choose a district.";
    if (!/^\d{5}$/.test(c.postal.trim())) e.postal = "Enter a 5-digit postal code.";
    setErrors(e);
    return e;
  };

  const submit = async (ev: any) => {
    ev.preventDefault();
    const e = validate();
    const first = Object.keys(e)[0];
    if (first) { const el = document.getElementById("co-" + first); if (el) el.focus(); return; }
    setBusy(true);
    const order = {
      customer: c, items: s.cart, subtotal: s.totals.subtotal, delivery: s.totals.delivery, total: s.totals.total, payment: c.payment,
    };
    const res = await PaymentGateway.createOrder(order);
    const placed = { ...order, orderId: res.orderId, status: res.status, placedAt: new Date().toISOString() };
    save("elan_last_order_v1", placed);
    s.setLastOrder(placed);
    s.clearCart();
    setBusy(false);
    location.hash = "order-confirmed";
  };

  const msg = buildWhatsAppMessage(s.cart, c, s.totals.subtotal, s.totals.delivery);

  return (
    <div className="wrap pt-10 lg:pt-16">
      <h1 className="font-display text-[clamp(2.6rem,6vw,4.4rem)] leading-none">Checkout</h1>
      <p className="text-muted mt-3 flex items-center gap-2"><Icon name="Lock" size={15} /> Demo checkout. No payment is taken on this site.</p>
      <form onSubmit={submit} noValidate className="mt-10 grid lg:grid-cols-[1fr_430px] gap-10 lg:gap-16 items-start">
        <div className="grid gap-10">
          <section aria-labelledby="h-contact">
            <h2 id="h-contact" className="font-display text-[1.9rem] mb-5">Contact</h2>
            <div className="grid sm:grid-cols-2 gap-4">
              <div className="sm:col-span-2"><Field id="co-name" label="Full name" error={errors.name}><input id="co-name" className={"field " + (errors.name ? "err" : "")} autoComplete="name" value={c.name} onChange={(e: any) => up("name", e.target.value)} /></Field></div>
              <Field id="co-phone" label="Phone number" error={errors.phone}><input id="co-phone" type="tel" inputMode="tel" placeholder="077 123 4567" className={"field " + (errors.phone ? "err" : "")} autoComplete="tel" value={c.phone} onChange={(e: any) => up("phone", e.target.value)} /></Field>
              <Field id="co-email" label="Email" error={errors.email}><input id="co-email" type="email" inputMode="email" className={"field " + (errors.email ? "err" : "")} autoComplete="email" value={c.email} onChange={(e: any) => up("email", e.target.value)} /></Field>
            </div>
          </section>

          <section aria-labelledby="h-delivery">
            <h2 id="h-delivery" className="font-display text-[1.9rem] mb-5">Delivery</h2>
            <div className="grid sm:grid-cols-2 gap-4">
              <div className="sm:col-span-2"><Field id="co-address" label="Delivery address" error={errors.address}><input id="co-address" className={"field " + (errors.address ? "err" : "")} autoComplete="street-address" value={c.address} onChange={(e: any) => up("address", e.target.value)} /></Field></div>
              <Field id="co-city" label="City" error={errors.city}><input id="co-city" className={"field " + (errors.city ? "err" : "")} autoComplete="address-level2" value={c.city} onChange={(e: any) => up("city", e.target.value)} /></Field>
              <Field id="co-district" label="District" error={errors.district}>
                <select id="co-district" className={"field " + (errors.district ? "err" : "")} value={c.district} onChange={(e: any) => up("district", e.target.value)}>
                  <option value="">Select district</option>
                  {DISTRICTS.map((d) => <option key={d}>{d}</option>)}
                </select>
              </Field>
              <Field id="co-postal" label="Postal code" error={errors.postal}><input id="co-postal" inputMode="numeric" maxLength={5} className={"field " + (errors.postal ? "err" : "")} autoComplete="postal-code" value={c.postal} onChange={(e: any) => up("postal", e.target.value.replace(/\D/g, ""))} /></Field>
              <div className="sm:col-span-2"><Field id="co-notes" label="Order notes (optional)"><textarea id="co-notes" rows={3} className="field !h-auto py-3" placeholder="Delivery instructions, preferred call time…" value={c.notes} onChange={(e: any) => up("notes", e.target.value)} /></Field></div>
            </div>
          </section>

          <section aria-labelledby="h-pay">
            <h2 id="h-pay" className="font-display text-[1.9rem] mb-5">Payment</h2>
            <div className="grid gap-3" role="radiogroup" aria-label="Payment method">
              {([["cod", "Cash on Delivery", "Pay in cash when your order arrives."], ["bank", "Bank Transfer", "Transfer to our account and send the receipt on WhatsApp."]] as const).map(([v, t, d]) => (
                <label key={v} className={"flex gap-4 items-start p-4 rounded-[10px] border cursor-pointer transition-colors " + (c.payment === v ? "border-charcoal bg-white" : "border-line hover:border-charcoal/50")}>
                  <input type="radio" name="payment" className="mt-1 w-5 h-5 accent-[#292925]" checked={c.payment === v} onChange={() => up("payment", v)} />
                  <span><span className="block font-medium text-[14.5px]">{t}</span><span className="block text-[13.5px] text-muted mt-0.5">{d}</span></span>
                </label>
              ))}
            </div>
            {c.payment === "bank" && (
              <dl className="mt-4 p-5 rounded-[10px] bg-beige text-[14px] grid grid-cols-[auto_1fr] gap-x-6 gap-y-1.5 pop">
                <dt className="text-muted">Bank</dt><dd>{CONFIG.bank.bank}</dd>
                <dt className="text-muted">Account name</dt><dd>{CONFIG.bank.accountName}</dd>
                <dt className="text-muted">Account no.</dt><dd className="select-all">{CONFIG.bank.accountNumber}</dd>
                <dt className="text-muted">Branch</dt><dd>{CONFIG.bank.branch}</dd>
              </dl>
            )}
          </section>
        </div>

        <aside className="lg:sticky self-start bg-white rounded-[14px] p-6 lg:p-8" style={{ top: "calc(env(safe-area-inset-top,0px) + 96px)" }} aria-label="Order summary">
          <h2 className="font-display text-[1.9rem] mb-5">Order summary</h2>
          <OrderSummary />
          <button type="submit" disabled={busy} className="btn btn-dark w-full mt-6">{busy ? "Placing order…" : "Place Order"}</button>
          <div className="flex items-center gap-3 my-4 text-[12px] text-muted"><span className="flex-1 h-px bg-line" />or<span className="flex-1 h-px bg-line" /></div>
          <a href={waLink(msg)} target="_blank" rel="noopener noreferrer" className="btn btn-line w-full"><Icon name="MessageCircle" size={17} /> Order via WhatsApp</a>
          <details className="mt-4 text-[13px]">
            <summary className="cursor-pointer text-muted">Preview WhatsApp message</summary>

function LookPage({ id }: { id: string }) {
  const s = useStore();
  const look = LOOKS.find((l) => l.id === id);
  const [size, setSize] = useState<Size | "">("");
  const [err, setErr] = useState(false);
  if (!look) return <NotFound />;
  const prods = look.pieces.map((x) => ({ ...x, p: byId(x.pid)! }));
  const total = prods.reduce((a, x) => a + x.p.price, 0);
  const addAll = () => {
    if (!size) { setErr(true); return; }
    prods.forEach((x, i) => s.addToCart(x.pid, x.color, size as Size, 1, i === prods.length - 1));
  };
  return (
    <div className="wrap pt-10 lg:pt-16">
      <nav className="text-[12.5px] text-muted mb-6" aria-label="Breadcrumb"><a href="#home" className="link-u">Home</a> / <a href="#collections" className="link-u">Collections</a> / <span className="text-charcoal">{look.name}</span></nav>
      <div className="grid lg:grid-cols-2 gap-10 lg:gap-20 items-center">
        <div className="aspect-[3/4] max-w-[560px] w-full mx-auto lg:mx-0 rounded-[14px] overflow-hidden">
          <Outfit tone={look.tone} pieces={prods.map((x) => ({ kind: x.p.kind, color: x.color }))} />
        </div>
        <div>
          <p className="eyebrow">Shop the look</p>
          <h1 className="font-display text-[clamp(2.6rem,6vw,4.6rem)] leading-none mt-3">{look.name}</h1>
          <p className="text-[16.5px] text-charcoal/75 mt-5 leading-relaxed max-w-[480px]">{look.blurb}</p>
          <ul className="mt-8 grid gap-3">
            {prods.map((x) => (
              <li key={x.pid}><a href={"#product-" + x.pid} className="flex items-center gap-4 p-3 bg-white rounded-[12px] hover:shadow-md transition-shadow">
                <span className="w-14 aspect-[3/4] rounded-md overflow-hidden block"><ProductImage p={x.p} color={x.color} /></span>
                <span className="flex-1 text-[14.5px]">{x.p.name}<span className="block text-[12.5px] text-muted">{x.color}</span></span>
                <span className="tabular-nums text-[14px]">{fmt(x.p.price)}</span>
              </a></li>
            ))}
          </ul>
          <div className="mt-8">
            <p className="text-[13px] mb-2"><span className="font-semibold">Size for all pieces:</span> {size || "Select"}</p>
            <div className="flex flex-wrap gap-2">{ALL_SIZES.map((z) => <button key={z} type="button" className={"chip " + (size === z ? "on" : "")} aria-pressed={size === z} onClick={() => { setSize(z); setErr(false); }}>{z}</button>)}</div>
            {err && <p className="text-[13px] text-[#9E3B2F] mt-2" role="alert">Please choose a size.</p>}
            <p className="text-[12.5px] text-muted mt-2">You can change the size of each piece in your bag.</p>
          </div>
          <button type="button" className="btn btn-dark mt-6 w-full sm:w-auto" onClick={addAll}>Add the full look · {fmt(total)}</button>
        </div>
      </div>
      <section className="pt-24">
        <SectionHead eyebrow="The pieces" title="Shop each piece" />
        <ProductGrid items={prods.map((x) => x.p)} cols="grid-cols-2 md:grid-cols-3 lg:grid-cols-4" />
      </section>
    </div>
  );
}

function Router() {
  const { route } = useStore();
  if (route === "home") return <HomePage />;
  if (route === "shop" || route.startsWith("shop-") || route === "new-arrivals" || route === "bestsellers" || route === "office-essentials") return <ShopPage route={route} />;
  if (route.startsWith("product-")) return <ProductPage id={route.slice(8)} />;
  if (route.startsWith("look-")) return <LookPage id={route.slice(5)} />;
  if (route === "collections") return <CollectionsPage />;
  if (route === "about") return <AboutPage />;
  if (route === "checkout") return <CheckoutPage />;
  if (route === "order-confirmed") return <ConfirmationPage />;
  if (route === "wishlist") return <WishlistPage />;
  if (route === "contact") return <ContactPage />;
  if (route.startsWith("policy-")) return <PolicyPage route={route} />;
  return <NotFound />;
}

function pageKey(route: string) {
  if (route === "shop" || route.startsWith("shop-") || route === "new-arrivals" || route === "bestsellers" || route === "office-essentials") return "shop";
  return route;
}

function App() {
  const s = useStore();
  useEffect(() => { document.title = CONFIG.brand.name; }, []);
  return (
    <div>
      <Header />
      <main key={pageKey(s.route)} className="page min-h-[60vh] pb-4"><Router /></main>
      <Footer />
      <CartDrawer />
      <MobileMenu />
      <SearchOverlay />
      <QuickView />
      <SizeGuide />
      <AccountModal />
      <Toast />
    </div>
  );
}

const rootEl = document.getElementById("root")!;
ReactDOM.createRoot(rootEl).render(<StoreProvider><App /></StoreProvider>);

</script>

<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:13px/1.5 monospace;color:#292925">The store could not start.\n' + String((e && e.message) || e) + '</pre>';
  }
  window.addEventListener('error', function (ev) {
    if (root.firstChild && root.firstChild.className === 'splash') fail(ev.error || ev.message);
  });
  try {
    if (!window.React || !window.ReactDOM) throw new Error('React did not load. Check your connection and reload.');
    if (!window.Babel) throw new Error('The compiler did not load. Check your connection and reload.');
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, {
      filename: 'app.tsx',
      presets: [['typescript', { isTSX: true, allExtensions: true }], 'react']
    }).code;
    var s = document.createElement('script');
    s.textContent = '(function(){\n' + out + '\n})();';
    document.body.appendChild(s);
  } catch (e) { fail(e); }
})();
</script>
